# grafana/provisioning/datasources/prometheus.yml
# Auto-provisioning: Tự động kết nối Grafana với Prometheus khi khởi động

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "5s"      # Khớp với scrape_interval của Prometheus
