groups:
  - name: demo
    rules:
      - alert: AppTargetDown
        expr: up{job="app"} == 0
        for: 10s
        labels:
          severity: critical
          service: app
        annotations:
          summary: "Application target is unreachable"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for at least 10 seconds."

      - alert: AIDetectorTargetDown
        expr: up{job="ai-detector"} == 0
        for: 10s
        labels:
          severity: critical
          service: ai-detector
        annotations:
          summary: "AI Detector target is unreachable"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for at least 10 seconds."

      - alert: HighRequestLatency
        expr: |
          sum(rate(app_request_latency_seconds_sum[30s]))
          /
          sum(rate(app_request_latency_seconds_count[30s])) > 1
        for: 10s
        labels:
          severity: warning
          service: app
        annotations:
          summary: "Average request latency is above 1 second"
          description: "The observed average latency is {{ $value | humanize }} seconds."

      - alert: HighCPUUsage
        expr: app_simulated_cpu_percent{job="app"} > 80
        for: 10s
        labels:
          severity: warning
          service: app
        annotations:
          summary: "Application CPU is above the 80% threshold"
          description: "The simulated CPU gauge is {{ $value | humanize }} percent."

      - alert: AIOpsAnomalyDetected
        expr: ai_anomaly_score{job="ai-detector"} >= 0.70
        for: 10s
        labels:
          severity: warning
          service: ai-detector
        annotations:
          summary: "AIOps anomaly score crossed 0.70"
          description: "The current application AI anomaly score is {{ $value | humanize }} (threshold 0.70)."

  - name: windows-host
    rules:
      - record: windows_host_cpu_percent
        expr: 100 * (1 - avg by (instance) (rate(windows_cpu_time_seconds_total{job="windows-host", mode="idle"}[1m])))

      # Legacy CPU-only score retained for reference; host AI score uses real CPU and exporter scrape duration.
      - record: windows_host_cpu_anomaly_score
        expr: clamp_max(abs(windows_host_cpu_percent - avg_over_time(windows_host_cpu_percent[5m])) / (3 * clamp_min(stddev_over_time(windows_host_cpu_percent[5m]), 2)), 1)

      - alert: WindowsHostExporterDown
        expr: up{job="windows-host"} == 0
        for: 10s
        labels:
          severity: critical
          service: windows-host
        annotations:
          summary: "Windows host exporter is unreachable"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for at least 10 seconds."

      - alert: WindowsHostAnomalyDetected
        expr: windows_ai_anomaly_score{machine="host"} >= 0.7
        for: 10s
        labels:
          severity: warning
          service: windows-host
        annotations:
          summary: "Windows host AI score crossed 0.70"
          description: "Combined real CPU and exporter scrape-latency anomaly score is {{ $value | humanize }}."

      - alert: WindowsHostCPUUsageHigh
        expr: windows_host_cpu_percent >= 80
        for: 5s
        labels:
          severity: warning
          service: windows-host
        annotations:
          summary: "Windows host CPU usage is at or above 80%"
          description: "CPU usage for {{ $labels.instance }} is {{ $value | humanize }} percent."

  - name: windows-client
    rules:
      - record: windows_client_cpu_percent
        expr: 100 * (1 - avg by (instance) (rate(windows_cpu_time_seconds_total{job="windows-client", mode="idle"}[1m])))

      # Legacy CPU-only score retained for reference; client AI score uses real CPU and exporter scrape duration.
      - record: windows_client_cpu_anomaly_score
        expr: clamp_max(abs(windows_client_cpu_percent - avg_over_time(windows_client_cpu_percent[5m])) / (3 * clamp_min(stddev_over_time(windows_client_cpu_percent[5m]), 2)), 1)

      - alert: WindowsClientExporterDown
        expr: up{job="windows-client"} == 0
        for: 10s
        labels:
          severity: critical
          service: windows-client
        annotations:
          summary: "Windows client exporter is unreachable"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for at least 10 seconds. Check VPN reachability and windows_exporter."

      - alert: WindowsClientAnomalyDetected
        expr: windows_ai_anomaly_score{machine="client"} >= 0.7
        for: 10s
        labels:
          severity: warning
          service: windows-client
        annotations:
          summary: "Windows client AI score crossed 0.70"
          description: "Combined real CPU and exporter scrape-latency anomaly score is {{ $value | humanize }}."

      - alert: WindowsClientCPUUsageHigh
        expr: windows_client_cpu_percent >= 80
        for: 5s
        labels:
          severity: warning
          service: windows-client
        annotations:
          summary: "Windows client CPU usage is at or above 80%"
          description: "CPU usage for {{ $labels.instance }} is {{ $value | humanize }} percent."
