# prometheus/prometheus.yml
# Cấu hình Prometheus: scrape cả app và ai-detector mỗi 5 giây

global:
  scrape_interval: 5s          # Thu thập metrics mỗi 5 giây (phù hợp demo real-time)
  evaluation_interval: 5s      # Đánh giá alerting rules mỗi 5 giây

rule_files:
  - "/etc/prometheus/alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # --- Windows host running Docker Desktop ---
  # windows_exporter listens on host port 9182 by default.
  - job_name: "windows-host"
    static_configs:
      - targets: ["host.docker.internal:9182"]
    metrics_path: /metrics

  - job_name: "windows-client"
    static_configs:
      - targets: ["26.46.160.244:9182"]
    metrics_path: /metrics

  # --- Service 1: Target Microservice (FastAPI) ---
  - job_name: "app"
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /metrics

  # --- Service 2: AIOps Detector (Isolation Forest) ---
  - job_name: "ai-detector"
    static_configs:
      - targets: ["ai-detector:8001"]
    metrics_path: /metrics


