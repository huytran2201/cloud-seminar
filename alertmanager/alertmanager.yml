global:
  resolve_timeout: 2m

route:
  receiver: local-webhook
  group_by: [alertname, service, severity]
  group_wait: 3s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: local-webhook
    webhook_configs:
      - url: http://alert-receiver:8081/webhook
        send_resolved: true
